name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's starter-workflow pattern):
  # a single job sometimes fails with "No artifacts named github-pages were
  # found" because deploy-pages looks for the upload before it is listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build placeholder site (dashboard is never published)
        run: |
          # The dashboard holds personal financial data, and Pages on a personal
          # account is public even for a private repo, so only a placeholder is
          # published. View the real dashboard via the private Claude artifact
          # or by opening index.html locally.
          mkdir -p _site
          printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Not available</title></head><body style="font-family:sans-serif;padding:40px;color:#555">This page is not available.</body></html>' > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
